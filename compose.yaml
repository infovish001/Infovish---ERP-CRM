name: infovish-erp
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.11-alpine}
    environment:
      POSTGRES_DB: infovish_platform
      POSTGRES_USER: infovish_local
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/setup-local.ps1 first}
    ports: ["127.0.0.1:54329:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infovish_local -d infovish_platform"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: ${REDIS_IMAGE:-redis:8.10-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:63799:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    working_dir: /app/backend
    env_file: backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    working_dir: /app/backend
    env_file: backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--timeout=60", "--sleep=1"]
volumes:
  postgres-data:
  redis-data:
