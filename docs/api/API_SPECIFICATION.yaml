          type: string
      description: >-
        Estimates over all authorized open opportunities in an optional pipeline, independently of list search/status
        filters. NUMERIC amounts; each weighted amount rounds half-up to six places before summation. Unknown amounts
        excluded from sums and counted explicitly. No recognized revenue or mixed-currency calculation.
    CrmAmount:
      type:
        - string
        - 'null'
      pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
      description: Optional nonnegative NUMERIC(20,6) CRM estimate returned as a six-place decimal string; null means unknown.
    SalesLineInput:
      type: object
