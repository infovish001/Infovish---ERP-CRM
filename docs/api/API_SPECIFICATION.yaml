components:
  securitySchemes:
    session:
      type: apiKey
      in: header
      name: Cookie
      description: Browser-managed, host-only session cookie named infovish_ followed by a hash of the registered host.
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      schema:
        enum:
          - company
          - branch
          - department
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
    Company:
      name: company_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
      description: Must be active and authorized in the host-resolved tenant.
    RecordId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: product
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{16,100}$
      description: Keep the same key for retries of the same actor/company/create operation. Use a new key for a different request.
  schemas:
    Readiness:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          enum:
            - ready
            - unavailable
        checks:
          type: object
          required:
            - database
            - redis
          properties:
            database:
              enum:
                - ready
                - unavailable
            redis:
              enum:
                - ready
                - unavailable
    ContactInput:
      type: object
      required:
        - company_id
        - name
        - customer
        - supplier
        - active
      properties:
        company_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
        active:
          type: boolean
        revision:
          type: integer
          minimum: 1
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 254
        phone:
          type:
            - string
            - 'null'
          maxLength: 40
        customer:
          type: boolean
        supplier:
          type: boolean
    Contact:
      allOf:
        - $ref: '#/components/schemas/ContactInput'
        - type: object
          required:
            - id
            - number
            - revision
          properties:
            id:
              type: string
              format: uuid
            number:
              type: string
              maxLength: 30
    Price:
      type:
        - string
        - 'null'
      pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
      description: Nonnegative NUMERIC(20,6), returned as a six-place decimal string; null means no list price.
    ProductInput:
      type: object
      required:
        - company_id
        - name
        - active
        - type
        - unit
        - sku
      properties:
        company_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
        active:
          type: boolean
        revision:
          type: integer
          minimum: 1
        type:
          enum:
            - product
            - service
        unit:
          type: string
          maxLength: 30
        sku:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_.-]{0,49}$
        list_price:
          $ref: '#/components/schemas/Price'
    VariantInput:
      type: object
      required:
        - company_id
        - name
        - active
        - attributes
        - sku
      properties:
        company_id:
          type: string
          format: uuid
