openapi: 3.1.0
info:
  title: Infovish platform, CRM, Sales and Finance API
  version: 0.6.0
  description: >-
    M02 session-authenticated organization APIs run on an exact registered tenant host. Sign in through Fortify,
    complete MFA when enrolled, and provide the host-bound session cookie. Mutations require the page's CSRF token.
    Tenant headers and body identifiers never select a tenant. Public token/OAuth integrations remain deferred. M03
    master data requires an active, entitled, installed module and an active authorized company. Privileged mutations
    require confirmed MFA. Creates require Idempotency-Key; repeated identical requests return the same UUID,
    conflicting reuse returns 409. Updates require the last observed revision. Master-data routes allow 120 requests per
    minute per authenticated actor. List endpoints return 25 records per page. Decimal list prices are strings in
    company base currency; no tax, discount or currency conversion is performed. M04 CRM depends on Parties and tenant
    schema 3. Members read/write assigned records in granted companies; auditors read granted companies; privileged MFA
    users configure pipelines, reassign, convert and reopen. No Sales orders or external communications are created. M05
    Sales requires schema 4 and Parties/Catalog/CRM. Privileged MFA mutations; company-granted member/auditor reads.
    Ordinary LK VAT profiles and explicit classifications; commercial PDFs are not tax invoices. No
    fulfillment/accounting effects.
    M06 Finance requires schema 5 and enabled Parties/Sales dependencies. Company-granted auditors read;
    owner/administrator MFA users mutate. LKR ledger, invoice/bill posting, recorded payments and manual
    reconciliation only. No external transfers, statutory corrections or certified financial statements.
paths:
  /login:
    post:
      operationId: login
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password accepted; two_factor flag indicates whether a challenge is required.
        '422':
          description: Generic invalid credentials or input validation failure.
        '429':
          description: Too many login attempts.
  /two-factor-challenge:
    post:
      operationId: completeMfa
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                recovery_code:
                  type: string
                  format: password
      responses:
        '204':
          description: MFA accepted and authenticated session regenerated.
        '403':
          description: Challenge tenant, identity state or session version did not match.
        '422':
          description: Invalid authentication or recovery code.
        '429':
          description: Too many challenge attempts.
  /api/v1/me:
    get:
      operationId: currentMembership
      security:
        - session: []
      responses:
        '200':
          description: Authenticated identity and current server-verified tenant role; no credentials or MFA secrets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  email:
                    type: string
                    format: email
                  tenant_id:
                    type: string
                    format: uuid
                  role:
                    enum:
                      - owner
                      - administrator
                      - auditor
                      - member
        '401':
          description: Login or fresh session required.
        '403':
          description: Membership or privileged MFA requirement denied access.
  /api/v1/organization:
    get:
      operationId: organization
      security:
        - session: []
      responses:
        '200':
          description: Companies, branches and departments filtered by current membership grants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  companies:
                    type: array
                    items:
                      type: object
                  branches:
                    type: array
                    items:
                      type: object
                  departments:
                    type: array
                    items:
                      type: object
        '401':
          description: Login or fresh session required.
        '403':
          description: Workspace access denied.
  /api/v1/organization/{kind}:
    post:
      operationId: createOrganizationRecord
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name
              properties:
                code:
                  type: string
                  pattern: ^[A-Z][A-Z0-9_-]{0,19}$
                name:
                  type: string
                  maxLength: 120
                base_currency:
                  type: string
                  pattern: ^[A-Z]{3}$
                  description: Required for a company; no conversion or accounting policy is implied.
                timezone:
                  type: string
                  description: Required IANA identifier for a company.
                company_id:
                  type: string
                  format: uuid
                  description: Required for a branch or department in this tenant.
                branch_id:
                  type:
                    - string
                    - 'null'
                  format: uuid
                  description: Optional department branch within the same company.
                active:
                  type: boolean
      responses:
        '201':
          description: Created atomically with an audit event; response contains its UUID.
        '401':
          description: Login required.
        '403':
          description: Role, scope, lifecycle or privileged MFA denied the operation.
        '422':
          description: Invalid fields or duplicate code.
  /api/v1/organization/{kind}/{id}:
    put:
      operationId: updateOrganizationRecord
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Kind'
        - $ref: '#/components/parameters/Csrf'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 120
                active:
                  type: boolean
      responses:
        '200':
          description: Name/status updated atomically with an audit event; immutable fields are not modified.
        '401':
          description: Login required.
        '403':
          description: Role or privileged MFA denied the operation.
        '404':
          description: Record does not exist in the resolved tenant database.
        '422':
          description: Validation failure.
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Laravel request processing is alive; independent of external services.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
  /ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Both platform dependencies are reachable; does not verify worker or migration state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: At least one dependency is unavailable; connection details are omitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/v1/contacts:
    get:
      operationId: listContacts
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Company'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100000
        - name: status
          in: query
          schema:
            enum:
              - all
              - active
              - inactive
            default: all
      responses:
        '200':
          description: Company-scoped searchable paginated records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
                  current_page:
                    type: integer
                  next_page_url:
                    type:
                      - string
                      - 'null'
                  prev_page_url:
                    type:
                      - string
                      - 'null'
        '401':
          description: Fresh tenant-bound login required.
        '403':
          description: Module entitlement/activation, MFA, role or company access denied.
        '404':
          description: Record not found in the authorized scope.
        '409':
          description: Revision, idempotency, dependency or schema conflict.
        '419':
          description: Missing or invalid CSRF token.
        '422':
          description: Validation failure; message and field errors returned.
        '429':
          description: Request rate limit exceeded.
    post:
      operationId: createContact
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/Idempotency'
      responses:
        '201':
          description: Created or updated record UUID. A create retry returns the same status and UUID.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
        '401':
          description: Fresh tenant-bound login required.
        '403':
          description: Module entitlement/activation, MFA, role or company access denied.
        '404':
          description: Record not found in the authorized scope.
        '409':
          description: Revision, idempotency, dependency or schema conflict.
        '419':
          description: Missing or invalid CSRF token.
        '422':
          description: Validation failure; message and field errors returned.
        '429':
          description: Request rate limit exceeded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
  /api/v1/contacts/{id}:
    put:
      operationId: updateContact
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Created or updated record UUID. A create retry returns the same status and UUID.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
        '401':
          description: Fresh tenant-bound login required.
        '403':
          description: Module entitlement/activation, MFA, role or company access denied.
        '404':
          description: Record not found in the authorized scope.
        '409':
          description: Revision, idempotency, dependency or schema conflict.
        '419':
          description: Missing or invalid CSRF token.
        '422':
          description: Validation failure; message and field errors returned.
        '429':
          description: Request rate limit exceeded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ContactInput'
                - required:
                    - revision
