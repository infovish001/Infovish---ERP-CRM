                format: uuid
              companyId:
                type: string
                format: uuid
              number:
                type: string
              quoteId:
                type: string
                format: uuid
              customerId:
                type: string
                format: uuid
              currency:
                const: LKR
              net:
                type: string
                pattern: ^-?[0-9]+\.[0-9]{2}$
              vat:
                type: string
                pattern: ^-?[0-9]+\.[0-9]{2}$
              total:
                type: string
                pattern: ^-?[0-9]+\.[0-9]{2}$
        suppliers:
          type: array
          items:
            type: object
            required:
