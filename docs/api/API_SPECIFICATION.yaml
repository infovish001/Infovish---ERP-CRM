          type: string
          format: uuid
        quantity:
          type: string
          pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
          description: Positive, six fractional places maximum.
        unit_price:
          type: string
          pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
          description: Explicit VAT-exclusive LKR decimal string. List prices are never substituted.
        discount_percent:
          type: string
          description: 0..100, six fractional places maximum.
        tax_code:
          enum:
            - standard
            - zero
            - exempt
            - unregistered
        tax_basis:
          type:
            - string
            - 'null'
          maxLength: 300
          description: Required legal basis for zero/exempt treatment.
