  /api/v1/events/{id}/replay:
    post:
      operationId: replayDeadLetter
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/Csrf'
      responses:
        '200':
          description: Dead-letter event returned to pending; an operator dispatcher must enqueue it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    const: pending
        '401':
          description: Fresh tenant-bound login required.
        '403':
          description: Module entitlement/activation, MFA, role or company access denied.
        '404':
          description: Record not found in the authorized scope.
        '409':
          description: Revision, idempotency, dependency or schema conflict.
        '419':
          description: Missing or invalid CSRF token.
        '422':
          description: Validation failure; message and field errors returned.
        '429':
          description: Request rate limit exceeded.
components:
  securitySchemes:
    session:
      type: apiKey
      in: header
      name: Cookie
      description: Browser-managed, host-only session cookie named infovish_ followed by a hash of the registered host.
  parameters:
    Kind:
      name: kind
      in: path
      required: true
      schema:
        enum:
          - company
          - branch
          - department
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
    Company:
      name: company_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
      description: Must be active and authorized in the host-resolved tenant.
    RecordId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: product
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{16,100}$
      description: Keep the same key for retries of the same actor/company/create operation. Use a new key for a different request.
  schemas:
    Readiness:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          enum:
            - ready
            - unavailable
        checks:
          type: object
          required:
            - database
            - redis
          properties:
            database:
              enum:
                - ready
                - unavailable
            redis:
              enum:
                - ready
                - unavailable
    ContactInput:
      type: object
      required:
        - company_id
        - name
        - customer
        - supplier
        - active
      properties:
        company_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
        active:
          type: boolean
        revision:
          type: integer
          minimum: 1
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 254
        phone:
          type:
            - string
            - 'null'
          maxLength: 40
        customer:
          type: boolean
        supplier:
          type: boolean
    Contact:
      allOf:
        - $ref: '#/components/schemas/ContactInput'
        - type: object
          required:
            - id
            - number
            - revision
          properties:
            id:
              type: string
              format: uuid
            number:
              type: string
              maxLength: 30
    Price:
      type:
        - string
        - 'null'
      pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
      description: Nonnegative NUMERIC(20,6), returned as a six-place decimal string; null means no list price.
    ProductInput:
      type: object
      required:
        - company_id
        - name
        - active
        - type
        - unit
        - sku
      properties:
        company_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
        active:
          type: boolean
        revision:
          type: integer
          minimum: 1
        type:
          enum:
            - product
            - service
        unit:
          type: string
          maxLength: 30
        sku:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_.-]{0,49}$
        list_price:
          $ref: '#/components/schemas/Price'
    VariantInput:
      type: object
      required:
        - company_id
        - name
        - active
        - attributes
        - sku
      properties:
        company_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
        active:
          type: boolean
        revision:
          type: integer
          minimum: 1
        sku:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9_.-]{0,49}$
        list_price:
          $ref: '#/components/schemas/Price'
        attributes:
          type: object
          maxProperties: 10
          propertyNames:
            pattern: ^[A-Za-z][A-Za-z0-9 _-]{0,39}$
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 100
    Variant:
      allOf:
        - $ref: '#/components/schemas/VariantInput'
        - type: object
          required:
            - id
            - revision
            - currency
          properties:
            id:
              type: string
              format: uuid
            product_id:
              type: string
              format: uuid
            currency:
              type: string
              pattern: ^[A-Z]{3}$
    Product:
      type: object
      required:
        - id
        - company_id
        - number
        - name
        - type
        - unit
        - active
        - revision
        - variants
      properties:
        company_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 160
        active:
          type: boolean
        revision:
          type: integer
          minimum: 1
        id:
          type: string
          format: uuid
        number:
