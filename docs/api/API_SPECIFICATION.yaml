              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
                    format: uuid
        '401':
          description: Fresh tenant-bound login required.
        '403':
          description: Module entitlement/activation, MFA, role or company access denied.
        '404':
          description: Record not found in the authorized scope.
        '409':
          description: Revision, idempotency, dependency or schema conflict.
        '419':
          description: Missing or invalid CSRF token.
        '422':
          description: Validation failure; message and field errors returned.
        '429':
          description: Request rate limit exceeded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ContactInput'
                - required:
                    - revision
