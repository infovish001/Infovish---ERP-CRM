                type: string
                pattern: ^[A-Z0-9][A-Z0-9_-]{0,19}$
              name:
                type: string
                maxLength: 160
              type:
                enum:
                  - asset
                  - liability
                  - equity
                  - income
                  - expense
              bank:
                type: boolean
              active:
                type: boolean
              revision:
                type: integer
                minimum: 1
        periods:
          type: array
          items:
            type: object
            required:
              - id
              - company_id
              - name
              - starts_on
              - ends_on
              - locked
              - revision
            properties:
              id:
                type: string
                format: uuid
              company_id:
                type: string
                format: uuid
              name:
                type: string
                maxLength: 100
              starts_on:
                type: string
                format: date
              ends_on:
                type: string
                format: date
              locked:
                type: boolean
              revision:
                type: integer
                minimum: 1
              reason:
                type:
                  - string
                  - 'null'
        settings:
          oneOf:
            - type: object
              required:
                - revision
                - receivable
                - payable
                - revenue
                - expense
                - vat_input
                - vat_output
                - seller_name
                - seller_address
                - vat_registered
                - issuer_code
              properties:
                revision:
                  type: integer
                  minimum: 0
                receivable:
                  type: string
                  format: uuid
                payable:
                  type: string
                  format: uuid
                revenue:
                  type: string
                  format: uuid
                expense:
                  type: string
                  format: uuid
                vat_input:
                  type: string
                  format: uuid
                vat_output:
                  type: string
                  format: uuid
                seller_name:
                  type: string
                  maxLength: 160
                seller_address:
                  type: string
                  maxLength: 500
                vat_registered:
                  type: boolean
                tin:
                  type:
                    - string
                    - 'null'
                  pattern: ^[0-9]{9}$
                vat_registration:
                  type:
                    - string
                    - 'null'
                  maxLength: 30
                vat_effective_from:
                  type:
                    - string
                    - 'null'
                  format: date
                issuer_code:
                  type: string
                  pattern: ^(?=[A-Z0-9]*[0-9])[A-Z0-9]{1,15}$
            - type: 'null'
        orders:
          type: array
          items:
            type: object
            required:
              - id
              - companyId
              - number
              - quoteId
              - customerId
              - currency
              - net
              - vat
              - total
            properties:
              id:
